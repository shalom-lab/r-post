name: Post (generate QMD & render)

on:
  workflow_dispatch:
    inputs:
      fromScheduled:
        description: "从已排期选题按顺序取下一条生成（true/false）"
        required: false
        type: string
        default: "true"
      topic:
        description: "手动主题（fromScheduled=false 且无 topicId 时用）"
        required: false
        type: string
        default: ""
      slug:
        description: "可选文件名 slug"
        required: false
        type: string
        default: ""
      note:
        description: "可选补充说明"
        required: false
        type: string
        default: ""
      promptId:
        description: "写作 Prompt id（post_prompt_*.md）"
        required: false
        type: string
        default: ""
      topicId:
        description: "指定选题 id（优先于排队）"
        required: false
        type: string
        default: ""
      categoryId:
        description: "分类 id（可选，稿件侧）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("ggplot2", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate QMD via DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          SLUG: ${{ inputs.slug }}
          NOTE: ${{ inputs.note }}
          PROMPT_ID: ${{ inputs.promptId }}
          TOPIC_ID: ${{ inputs.topicId }}
          CATEGORY_ID: ${{ inputs.categoryId }}
          FROM_SCHEDULED: ${{ inputs.fromScheduled }}
        run: node scripts/generate-qmd.mjs

      - name: Resolve slug
        id: slug
        run: |
          SLUG=$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('content/.last-generate.json','utf8')); process.stdout.write(j.slug)")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Using slug=$SLUG"

      - name: Render QMD to GFM
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          mkdir -p content/published
          quarto render "content/drafts/${SLUG}.qmd" --to gfm --output-dir content/published
          if [ ! -f "content/published/${SLUG}.md" ]; then
            FOUND=$(find content/published -maxdepth 2 -name '*.md' | head -n 1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" "content/published/${SLUG}.md"
            fi
          fi

      - name: Embed images as data URI
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          node scripts/embed-images.mjs "content/published/${SLUG}.md"

      - name: Update content index
        run: node scripts/update-index.mjs --slug "${{ steps.slug.outputs.slug }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ topics/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "content: generate ${{ steps.slug.outputs.slug }}"
          git push
