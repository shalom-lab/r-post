name: Topic Generate

on:
  workflow_dispatch:
    inputs:
      quota:
        description: "生成数量（留空使用 JSON 默认值）"
        required: false
        type: string
        default: ""
      promptId:
        description: "选题 Prompt id（留空用默认）"
        required: false
        type: string
        default: ""
      categoryId:
        description: "ideate 可选分类 id"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: topic-generate
  cancel-in-progress: false

jobs:
  topic-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run topic-generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QUOTA: ${{ inputs.quota }}
          PROMPT_ID: ${{ inputs.promptId }}
          CATEGORY_ID: ${{ inputs.categoryId }}
        run: node scripts/topic-generate.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "topics: generate candidates"
          git push
