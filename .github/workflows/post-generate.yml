name: Post Generate (QMD → render → index)

on:
  workflow_dispatch:
    inputs:
      topicId:
        description: "指定候选选题 id"
        required: false
        type: string
        default: ""
      topic:
        description: "自由主题（无 topicId 时使用）"
        required: false
        type: string
        default: ""
      slug:
        description: "可选文件名 slug"
        required: false
        type: string
        default: ""
      note:
        description: "可选补充说明"
        required: false
        type: string
        default: ""
      promptId:
        description: "写作 Prompt id（post_prompt_*.md）"
        required: false
        type: string
        default: ""
      categoryId:
        description: "分类 id（可选）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: post-generate
  cancel-in-progress: false

jobs:
  post-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("ggplot2", "knitr", "rmarkdown", "writexl"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate QMD via DeepSeek
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          SLUG: ${{ inputs.slug }}
          NOTE: ${{ inputs.note }}
          PROMPT_ID: ${{ inputs.promptId }}
          TOPIC_ID: ${{ inputs.topicId }}
          CATEGORY_ID: ${{ inputs.categoryId }}
        run: node scripts/post-generate.mjs

      - name: Render QMD to GFM
        run: |
          quarto render "${{ steps.generate.outputs.qmd }}" --to gfm

      - name: Finalize (embed images + update index)
        run: |
          node scripts/embed-images.mjs "${{ steps.generate.outputs.md }}"
          node scripts/update-index.mjs
          node scripts/update-topics-md.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ topics/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "content: generate ${{ steps.generate.outputs.slug }}"
          git push
