name: Post Generate (QMD → render → index)

on:
  workflow_dispatch:
    inputs:
      topicId:
        description: "指定候选选题 id"
        required: false
        type: string
        default: ""
      topic:
        description: "自由主题（无 topicId 时使用）"
        required: false
        type: string
        default: ""
      slug:
        description: "可选文件名 slug"
        required: false
        type: string
        default: ""
      note:
        description: "可选补充说明"
        required: false
        type: string
        default: ""
      promptId:
        description: "写作 Prompt id（post_prompt_*.md）"
        required: false
        type: string
        default: ""
      categoryId:
        description: "分类 id（可选）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: post-generate
  cancel-in-progress: false

jobs:
  post-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("ggplot2", "knitr", "rmarkdown", "writexl"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate QMD via DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          SLUG: ${{ inputs.slug }}
          NOTE: ${{ inputs.note }}
          PROMPT_ID: ${{ inputs.promptId }}
          TOPIC_ID: ${{ inputs.topicId }}
          CATEGORY_ID: ${{ inputs.categoryId }}
        run: node scripts/post-generate.mjs

      - name: Resolve slug
        id: slug
        run: |
          SLUG=$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('content/.last-generate.json','utf8')); process.stdout.write(j.slug)")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "[post-generate] slug=$SLUG"

      - name: Render QMD to GFM
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          mkdir -p content/published
          quarto render "content/drafts/${SLUG}.qmd" --to gfm --output-dir content/published
          # 确保文件名匹配 slug
          if [ ! -f "content/published/${SLUG}.md" ]; then
            FOUND=$(find content/published -maxdepth 2 -name '*.md' | head -n 1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" "content/published/${SLUG}.md"
            fi
          fi

      - name: Finalize (embed images + update index)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          # 内嵌图片 + 更新索引（post-generate 的 --update-only 模式）
          node scripts/embed-images.mjs "content/published/${SLUG}.md"
          node scripts/update-index.mjs --slug "${SLUG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ topics/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "content: generate ${{ steps.slug.outputs.slug }}"
          git push
